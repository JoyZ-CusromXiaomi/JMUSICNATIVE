
name: Build JoyMusic APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JoyMusic Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate JoyMusic source
        id: source
        shell: bash
        run: |
          if [ -f "gradlew" ] && [ -d "app" ]; then
            PROJECT_DIR="."
          else
            ZIP_FILE=$(find . -maxdepth 1 -type f \
              -iname '*JoyMusic*.zip' | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: JoyMusic ZIP not found."
              ls -la
              exit 1
            fi

            mkdir -p joymusic-source
            unzip -q "$ZIP_FILE" -d joymusic-source

            GRADLEW=$(find joymusic-source \
              -type f -name gradlew | head -n 1)

            if [ -z "$GRADLEW" ]; then
              echo "ERROR: gradlew not found in ZIP."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$GRADLEW")
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "JoyMusic project: $PROJECT_DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK
        id: android
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          MANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$MANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "sdk_root=$SDK" >> "$GITHUB_OUTPUT"
          echo "sdkmanager=$MANAGER" >> "$GITHUB_OUTPUT"

      - name: Accept Android licenses
        shell: bash
        run: |
          SDK="${{ steps.android.outputs.sdk_root }}"
          MANAGER="${{ steps.android.outputs.sdkmanager }}"

          yes | "$MANAGER" \
            --sdk_root="$SDK" --licenses || true

      - name: Install Android SDK 37.2
        shell: bash
        run: |
          SDK="${{ steps.android.outputs.sdk_root }}"
          MANAGER="${{ steps.android.outputs.sdkmanager }}"

          "$MANAGER" --sdk_root="$SDK" \
            --install "platforms;android-37.2" "platform-tools"

          echo "Installed Android platforms:"
          ls -la "$SDK/platforms"

      - name: Verify Android SDK
        shell: bash
        run: |
          SDK="${{ steps.android.outputs.sdk_root }}"

          if [ ! -d "$SDK/platforms/android-37.2" ]; then
            echo "ERROR: Android SDK 37.2 installation failed."
            exit 1
          fi

          echo "Android SDK 37.2 is ready."

      - name: Create debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Build JoyMusic APK
        working-directory: ${{ steps.source.outputs.dir }}
        env:
          METROLIST_APPLICATION_ID: com.joymusic.app
          METROLIST_APP_NAME: JoyMusic
        run: |
          chmod +x ./gradlew

          ./gradlew --no-daemon \
            --stacktrace assembleFossRelease

      - name: Upload JoyMusic APK
        uses: actions/upload-artifact@v4
        with:
          name: JoyMusic-APK
          path: ${{ steps.source.outputs.dir }}/app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
          retention-days: 14
          
