name: Build JoyMusic APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JoyMusic Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate JoyMusic source
        id: source
        shell: bash
        run: |
          if [ -f "gradlew" ] && [ -d "app" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "JoyMusic_Source_Android17_API37.zip" ]; then
            mkdir -p joymusic-source
            unzip -q "JoyMusic_Source_Android17_API37.zip" -d joymusic-source
            echo "dir=joymusic-source" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: JoyMusic ZIP not found."
            ls -la
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK
        id: android
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK not found."
            exit 1
          fi

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found."
            exit 1
          fi

          echo "sdk_root=$SDK_ROOT" >> "$GITHUB_OUTPUT"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "${{ steps.android.outputs.sdkmanager }}" \
            --sdk_root="${{ steps.android.outputs.sdk_root }}" \
            --licenses || true

      - name: Check Available Android SDK
        id: check_sdk
        shell: bash
        run: |
          SDK="${{ steps.android.outputs.sdk_root }}"
          MANAGER="${{ steps.android.outputs.sdkmanager }}"

          "$MANAGER" --sdk_root="$SDK" --list \
            | tee /tmp/android-sdk-list.txt

          PACKAGE=$(grep -oE 'platforms;android-37(\.0)?' \
            /tmp/android-sdk-list.txt | sort -u | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: Android API 37 package not found."
            echo "Available Android platforms:"
            grep -E 'platforms;android-' \
              /tmp/android-sdk-list.txt || true
            exit 1
          fi

          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "Found package: $PACKAGE"

      - name: Install Android SDK 37
        shell: bash
        run: |
          SDK="${{ steps.android.outputs.sdk_root }}"
          MANAGER="${{ steps.android.outputs.sdkmanager }}"
          PACKAGE="${{ steps.check_sdk.outputs.package }}"

          "$MANAGER" --sdk_root="$SDK" \
            --install "$PACKAGE" "platform-tools"

          if [ ! -d "$SDK/platforms/android-37" ] && \
             [ -d "$SDK/platforms/android-37.0" ]; then
            ln -s android-37.0 "$SDK/platforms/android-37"
          fi

          ls -la "$SDK/platforms"

      - name: Create debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build JoyMusic APK
        working-directory: ${{ steps.source.outputs.dir }}
        env:
          METROLIST_APPLICATION_ID: com.joymusic.app
          METROLIST_APP_NAME: JoyMusic
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleFossRelease

      - name: Upload JoyMusic APK
        uses: actions/upload-artifact@v4
        with:
          name: JoyMusic-APK
          path: ${{ steps.source.outputs.dir }}/app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
          retention-days: 14
          
