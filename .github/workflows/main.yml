name: Build JoyMusic APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JoyMusic FOSS Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate JoyMusic source
        id: source
        shell: bash
        run: |
          if [ -f "gradlew" ] && [ -d "app" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "JoyMusic_Android_Native_Source_SDK36.zip" ]; then
            mkdir -p joymusic-source
            unzip -q "JoyMusic_Android_Native_Source_SDK36.zip" -d joymusic-source
            echo "dir=joymusic-source" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: JoyMusic SDK36 ZIP not found."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate preinstalled Android SDK
        id: android
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: SDK Manager not found."
            exit 1
          fi

          echo "sdk_root=$SDK_ROOT" >> "$GITHUB_OUTPUT"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

          echo "Android SDK: $SDK_ROOT"
          echo "SDK Manager: $SDKMANAGER"

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "${{ steps.android.outputs.sdkmanager }}" \
            --sdk_root="${{ steps.android.outputs.sdk_root }}" \
            --licenses || true

      - name: Install Android SDK 36
        shell: bash
        run: |
          "${{ steps.android.outputs.sdkmanager }}" \
            --sdk_root="${{ steps.android.outputs.sdk_root }}" \
            --install "platforms;android-36" "platform-tools"

      - name: Create debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Build JoyMusic APK
        working-directory: ${{ steps.source.outputs.dir }}
        env:
          METROLIST_APPLICATION_ID: com.joymusic.app
          METROLIST_APP_NAME: JoyMusic
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleFossRelease

      - name: Upload JoyMusic APK
        uses: actions/upload-artifact@v4
        with:
          name: JoyMusic-APK
          path: ${{ steps.source.outputs.dir }}/app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
          retention-days: 14
          
