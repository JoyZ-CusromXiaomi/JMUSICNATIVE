name: Build JoyMusic APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JoyMusic FOSS Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate JoyMusic source
        id: source
        shell: bash
        run: |
          if [ -f "gradlew" ] && [ -d "app" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "JoyMusic_Android_Native_Source.zip" ]; then
            mkdir -p joymusic-source
            unzip -q "JoyMusic_Android_Native_Source.zip" -d joymusic-source
            echo "dir=joymusic-source" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Could not find gradlew/app at repository root or JoyMusic_Android_Native_Source.zip."
            echo "Upload the native source ZIP with that exact filename, or upload the extracted project files."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 37
        run: sdkmanager "platforms;android-37"

      - name: Create debug signing key for testing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build signed JoyMusic APK
        working-directory: ${{{{ steps.source.outputs.dir }}}}
        env:
          METROLIST_APPLICATION_ID: com.joymusic.app
          METROLIST_APP_NAME: JoyMusic
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleFossRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoyMusic-APK
          path: ${{{{ steps.source.outputs.dir }}}}/app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
          retention-days: 14
          
